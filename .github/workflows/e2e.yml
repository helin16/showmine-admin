name: E2E

# Runs against production, so it stays off pull requests and ordinary pushes.
# Signed-in journeys are skipped until the E2E_EMAIL and E2E_PASSWORD secrets exist.
# Normal member journeys are skipped until the E2E_MEMBER_EMAIL and E2E_MEMBER_PASSWORD secrets exist.
on:
  deployment_status:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      admin_url:
        description: Admin address to test, such as a preview. Leave empty for production.
        required: false

permissions:
  contents: read

concurrency:
  group: e2e-production
  cancel-in-progress: false

jobs:
  production:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    # Comes with the browser, so a slow Ubuntu mirror cannot stall the run. Keep in step with @playwright/test.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 10
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_COMPANY_NAME: test company
      E2E_ADMIN_URL: ${{ inputs.admin_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npx -y yarn@1.22.22 install --frozen-lockfile
      - run: npx playwright test --config e2e/playwright.config.ts
