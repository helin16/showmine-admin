name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npx -y yarn@1.22.22 install --frozen-lockfile
      - run: npx eslint src --ext .ts,.tsx
      - run: npx tsc --noEmit
      - name: Unit tests with the 90% coverage gate
        run: npx -y yarn@1.22.22 test
      - run: npx vite build
